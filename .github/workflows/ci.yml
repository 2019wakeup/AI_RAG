name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

# 课程设计要求「可复现」：CI 只做确定性检查（类型 + 单测），
# 需要模型下载/索引构建/LLM 的评测不放在 CI，命令见 docs/复现指南.md。
permissions:
  contents: read

# 同一分支的旧运行自动取消，避免排队抢资源（PR 更新时尤其明显）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Print toolchain（耗时取证用）
        run: |
          node -v
          pnpm -v
          nproc

      - name: Install
        # onnxruntime-node 的 postinstall 默认尝试下载 CUDA GPU 运行时（CI 无 GPU 且该版本资源 404），
        # 本项目只用 CPU 推理，用环境变量跳过——注意 .npmrc 里的同名配置在 pnpm 12 下不保证透传给 postinstall。
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: pnpm install --frozen-lockfile

      - name: Typecheck（全仓）
        run: pnpm -r typecheck

      - name: Unit & integration tests（全仓）
        run: pnpm test
